services:
  windows:
    image: dockurr/windows:latest
    container_name: windows11
    privileged: true

    environment:
      VERSION: "11"

      LANGUAGE: "Portuguese"
      REGION: "pt-BR"
      KEYBOARD: "pt-BR"

      # NAT para internet dentro do Windows
      NETWORK: "nat"

      # Recursos do GitHub Codespace
      CPU_CORES: "4"
      RAM_SIZE: "4G"

      # Disco virtual do Windows
      DISK_SIZE: "64G"

      USERNAME: "Docker"
      PASSWORD: "admin"
      AUTOLOGIN: "Y"

      # KVM
      KVM: "Y"
      RAM_CHECK: "Y"

    # DNS do container
    dns:
      - 1.1.1.1
      - 8.8.8.8

    dns_opt:
      - "timeout:2"
      - "attempts:3"

    devices:
      - /dev/kvm
      - /dev/net/tun

    cap_add:
      - NET_ADMIN

    ports:
      - "8006:8006"
      - "3389:3389/tcp"
      - "3389:3389/udp"

    volumes:
      - windows_data:/storage

    restart: unless-stopped
    stop_grace_period: 2m

volumes:
  windows_data:
